name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXIFTOOL_VERSION: "13.58"
  # SHA256 of exiftool-13.58_64.zip (SourceForge version archive).
  EXIFTOOL_SHA256: "fd3b407a01e6ffc6160f2d5fde5ff0c003f6c4c2ba85eee1ce8928ccb51fa3e6"
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Read and check version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $extra = @()
          if ($env:REF_TYPE -eq "tag") { $extra = @("--tag", $env:REF_NAME) }
          python scripts/ci/get_version.py @extra
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Cache ExifTool
        id: exiftool-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/exiftool
          key: exiftool-${{ env.EXIFTOOL_VERSION }}-${{ env.EXIFTOOL_SHA256 }}

      - name: Download ExifTool
        if: steps.exiftool-cache.outputs.cache-hit != 'true'
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "exiftool-$env:EXIFTOOL_VERSION`_64.zip"
          $url = "https://sourceforge.net/projects/exiftool/files/exiftool-$env:EXIFTOOL_VERSION`_64.zip/download"
          $ok = $false
          for ($i = 1; $i -le 5 -and -not $ok; $i++) {
            curl.exe -fsSL --retry 3 -o $zip $url
            if ($LASTEXITCODE -eq 0) {
              $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
              if ($hash -eq $env:EXIFTOOL_SHA256) { $ok = $true } else { Write-Warning "attempt ${i}: SHA256 mismatch ($hash)" }
            } else {
              Write-Warning "attempt ${i}: download failed ($LASTEXITCODE)"
            }
            if (-not $ok) { Start-Sleep -Seconds 10 }
          }
          if (-not $ok) { throw "Failed to download ExifTool $env:EXIFTOOL_VERSION with expected SHA256" }

          $extract = Join-Path $env:RUNNER_TEMP "exiftool-extract"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $src = Join-Path $extract "exiftool-$env:EXIFTOOL_VERSION`_64"
          $dest = Join-Path $env:RUNNER_TEMP "exiftool"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath (Join-Path $src "exiftool(-k).exe") -Destination (Join-Path $dest "exiftool.exe")
          Copy-Item -LiteralPath (Join-Path $src "exiftool_files") -Destination $dest -Recurse

      - name: Configure ExifTool
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "exiftool"
          foreach ($p in @("exiftool.exe", "exiftool_files\perl.exe", "exiftool_files\exiftool.pl", "exiftool_files\lib")) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $p))) { throw "ExifTool layout incomplete: $p missing" }
          }
          & (Join-Path $dir "exiftool_files\perl.exe") (Join-Path $dir "exiftool_files\exiftool.pl") -ver
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "EXIFTOOL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build onefile exe (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm AzureKilnPhotoTool_onefile.spec
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify bundle contents
        run: |
          python scripts/ci/verify_bundle.py dist/AzureKilnPhotoTool.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package portable zip
        id: portable
        run: |
          python scripts/ci/package_portable.py --version "${{ steps.version.outputs.version }}" --exe dist/AzureKilnPhotoTool.exe --output-dir release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Ensure Inno Setup
        id: inno
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          Write-Host "Using $iscc"
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build installer (Inno Setup)
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $date = "${{ steps.portable.outputs.date }}"
          & "${{ steps.inno.outputs.iscc }}" `
            "/DAppVersion=$ver" `
            "/DSourceExe=$env:GITHUB_WORKSPACE\dist\AzureKilnPhotoTool.exe" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\release" `
            "/DOutputBaseFilename=AzureKilnPhotoTool-$ver-$date-windows-x64-setup" `
            installer\AzureKilnPhotoTool.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AzureKilnPhotoTool-${{ steps.version.outputs.version }}-${{ steps.portable.outputs.date }}-windows-x64
          if-no-files-found: error
          path: |
            release/${{ steps.portable.outputs.base_name }}.zip
            release/${{ steps.portable.outputs.base_name }}.sha256.txt
            release/AzureKilnPhotoTool-${{ steps.version.outputs.version }}-${{ steps.portable.outputs.date }}-windows-x64-setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AzureKiln Photo Tool ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/${{ steps.portable.outputs.base_name }}.zip
            release/${{ steps.portable.outputs.base_name }}.sha256.txt
            release/AzureKilnPhotoTool-${{ steps.version.outputs.version }}-${{ steps.portable.outputs.date }}-windows-x64-setup.exe
